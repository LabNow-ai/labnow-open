name: build-docker-images  # Build Docker Image for LabNow Open Source Version

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
    paths-ignore: ["*.md"]
  pull_request:
    branches: [ "main" ]
    paths-ignore: [ "*.md" ]
  schedule: # Run workflow every 2 weeks at 00:00 UTC on Sunday
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allows you to run this workflow manually from the Actions tab

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai
  BUILDKIT_PROGRESS: "plain"  # Full logs for CI build.
  REGISTRY_SRC: ${{ vars.REGISTRY_SRC || 'docker.io' }} # For BASE_NAMESPACE of images: where to pull base images from, docker.io or other source registry URL.
  REGISTRY_DST: ${{ vars.REGISTRY_DST || 'quay.io' }} # For tags of built images: where to push images to, docker.io or other destination registry URL.
  # DOCKER_REGISTRY_USERNAME and DOCKER_REGISTRY_PASSWORD is required for docker image push, they should be set in CI secrets.
  DOCKER_REGISTRY_USERNAME: ${{ vars.DOCKER_REGISTRY_USERNAME }}
  DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}
  # used to sync image to mirror registry
  DOCKER_MIRROR_REGISTRY_USERNAME: ${{ vars.DOCKER_MIRROR_REGISTRY_USERNAME }}
  DOCKER_MIRROR_REGISTRY_PASSWORD: ${{ secrets.DOCKER_MIRROR_REGISTRY_PASSWORD }}
  CI_PROJECT_NAME: ${{ vars.CI_PROJECT_NAME || 'LabNow/labnow-open' }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  COMMIT_SHA: ${{ github.sha }} # COMMIT_SHA="$(git rev-parse --short HEAD)"

jobs:
  job-semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    continue-on-error: true
    if: (github.actor != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@v7
      - run: |
          semgrep ci --verbose \
            --config p/ci \
            --config p/security-audit \
            --config p/python \
            --config p/javascript \
            --config p/react \
            --config p/owasp-top-ten \
            --exclude-rule=dockerfile.security.missing-user.missing-user \
            --exclude-rule=yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag

  job-developer:
    name: "labnow-open-dev"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          source ./tool/tool.sh
          build_image labnow-open-dev latest ./src/labnow-open.Dockerfile \
            --build-arg "PROFILE_LOCALIZE=default" --build-arg "BASE_IMG=developer:latest"
          push_image  labnow-open-dev

  job-data-science:
    name: "labnow-open-data-science"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          source ./tool/tool.sh
          build_image labnow-open-data-science latest ./src/labnow-open.Dockerfile \
            --build-arg "PROFILE_LOCALIZE=default" --build-arg "BASE_IMG=data-science-dev:latest"
          push_image  labnow-open-data-science

  job-openclaw:
    name: "labnow-open-openclaw"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          source ./tool/tool.sh
          build_image labnow-open-openclaw latest ./src/labnow-open.Dockerfile \
            --build-arg "PROFILE_LOCALIZE=default" --build-arg "BASE_IMG=openclaw:latest"
          push_image  labnow-open-openclaw

  job-hermes:
    name: "labnow-open-hermes"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          source ./tool/tool.sh
          build_image labnow-open-hermes latest ./src/labnow-open.Dockerfile \
            --build-arg "PROFILE_LOCALIZE=default" --build-arg "BASE_IMG=hermes:latest"
          push_image  labnow-open-hermes

  job-gui:
    name: "labnow-open-gui"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          source ./tool/tool.sh
          IMG_PREFIX_SRC=quay.io/labnow build_image labnow-open-gui latest ./src/labnow-open.Dockerfile \
            --target gui --build-arg "PROFILE_LOCALIZE=default" \
            --build-arg "BASE_IMG=gui-linux@sha256:554dbde12fc67da5383c3a3a3384a78353185fc85450fc62ca4b3974a8f51eda"
          push_image labnow-open-gui

  ## Sync all images in this build (listed by "names") to mirror registry.
  job-sync-images:
    needs: ["job-developer", "job-data-science", "job-openclaw", "job-hermes", "job-gui"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - env:
          AUTH_FILE_CONTENT: ${{ secrets.AUTH_FILE_CONTENT }}
          DOCKER_MIRROR_REGISTRY: ${{ vars.DOCKER_MIRROR_REGISTRY }}
          DOCKER_MIRROR_TARGETS: ${{ vars.DOCKER_MIRROR_TARGETS }}
        run: |
          source ./tool/tool.sh
          printf '%s' "$AUTH_FILE_CONTENT" > .github/workflows/auth.json && ls -alh ./.github/workflows
          printenv | grep -v 'PATH' > /tmp/docker.env && echo "REGISTRY_URL=${REGISTRY_DST}" >> /tmp/docker.env
          docker run --rm --env-file /tmp/docker.env -v $(pwd):/tmp -w /tmp \
            labnow/docker-kit@sha256:ca36d8b47349baed548cc104139da2375a43799659b3a3b63bd26282acd1f06a \
            script-sync-image.sh --image-namespace-src="$IMG_NAMESPACE" \
            --file-auth=/tmp/.github/workflows/auth.json
