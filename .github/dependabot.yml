version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    groups:
      all-github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/src"
    schedule:
      interval: "weekly"
      day: "sunday"
    groups:
      all-docker:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/src"
    schedule:
      interval: "weekly"
      day: "sunday"
    groups:
      all-pip:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/admin"
    schedule:
      interval: "weekly"
      day: "sunday"
    groups:
      all-npm:
        patterns:
          - "*"
