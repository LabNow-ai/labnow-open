version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    groups:
      all-github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/src"
    schedule:
      interval: "weekly"
      day: "sunday"
    groups:
      all-docker:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/src/labnow-open-web"
    schedule:
      interval: "weekly"
      day: "sunday"
    cooldown:
      default-days: 7
    groups:
      all-npm:
        patterns:
          - "*"
