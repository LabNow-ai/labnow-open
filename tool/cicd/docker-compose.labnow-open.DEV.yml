name: ${PROJECT_NAME:-dev-labnow-open}


services:
  dev-labnow-open:
    container_name: ${CONTAINER_NAME:-dev-labnow-open}
    hostname: ${CONTAINER_NAME:-dev-labnow-open}
    image: quay.io/labnow/data-science-dev:latest
    restart: always
    environment:
      - PROFILE_LOCALIZE=${PROFILE_LOCALIZE:-aliyun-pub}
      - ENV_PROFILE=${ENV_PROFILE:-DEV}
      - STATIC_DIR=/opt/labnow-open/web
    env_file: ["../credentials/${ENV_PROFILE:-DEV}-labnow-open.env"]
    user: "0:0"
    ports: ["${PORT_APP:-20000}:80", "${PORT_WEB:-30000}:3000"]
    working_dir: /workspace
    volumes:
      - ../../:/workspace:rw
      - ${PNPM_STORE_PATH:-$HOME/.pnpm-store}:/workspace/.pnpm-store:rw
      - ${PNPM_STORE_PATH:-$HOME/.pnpm-store}:/root/.pnpm-store:rw
      # AI4Coding tools:
      - "$HOME/.claude:/root/.claude:rw"
      - "$HOME/.codex:/root/.codex:rw"
      - "$HOME/.copilot:/root/.copilot:rw"
      - "$HOME/.gemini:/root/.gemini:rw"
    command: "tail -f /dev/null"
